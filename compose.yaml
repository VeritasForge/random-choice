# 내 컴퓨터에서만 쓰는 개발용 인프라. 실서비스와는 아무 연결이 없다.
# `just db`로 켜고 `just db-stop`으로 끈다.
# 이름을 고정하는 이유: 안 적으면 폴더 이름을 따라가서, 저장소를 다른 폴더(예: git worktree)에
# 내려받을 때마다 데이터베이스가 따로 생기고 같은 포트를 두고 부딪힌다.
name: random-choice

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: random_choice
      POSTGRES_PASSWORD: random_choice
      POSTGRES_DB: random_choice
    ports:
      # 5432가 아니라 5433인 이유: 컴퓨터에 따로 깔린 Postgres가 있으면 5432를 이미 쓰고 있다.
      # 127.0.0.1에만 열어서 같은 네트워크의 다른 기기에서는 접속할 수 없다.
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U random_choice -d random_choice"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
