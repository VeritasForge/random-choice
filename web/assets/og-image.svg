<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- 링크를 붙였을 때 나오는 미리보기 그림의 원본. 고친 뒤에는 `node scripts/make-icons.mjs`를 다시 돌린다. -->
  <!-- 글자는 그 스크립트를 돌린 컴퓨터에 깔린 글꼴로 그려지므로, 만든 PNG를 눈으로 확인한다. -->
  <!-- 메신저가 가운데만 잘라 보여 주는 경우가 있어, 그릇과 글자를 가로 가운데 800 폭 안에 둔다. -->
  <!-- 바탕은 화면과 같은 나무색이고, 글자는 화면에서처럼 종이색 바닥 위에 둔다. -->
  <rect width="1200" height="630" fill="#e8d6b4"/>
  <rect x="200" y="150" width="800" height="330" rx="24" fill="#faf9f7" stroke="#1c1a17" stroke-width="3"/>
  <!-- 그릇은 assets/app-icon.svg와 같은 그림이다. 한쪽을 고치면 다른 쪽도 같이 본다. -->
  <g transform="translate(189 115) scale(3.4)">
    <path d="M24 54a28 26 0 0 1 56 0z" fill="#ffffff" stroke="#1c1a17" stroke-width="3" stroke-linejoin="round"/>
    <path d="M18 54h68q0 28-24 32v4H42v-4Q18 82 18 54z" fill="#b8552f" stroke="#1c1a17" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="42" cy="68" r="3" fill="#1c1a17"/><circle cx="62" cy="68" r="3" fill="#1c1a17"/>
    <path d="M47 74q5 5 10 0" stroke="#1c1a17" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="35" cy="74" r="4" fill="#f4b9a0"/><circle cx="69" cy="74" r="4" fill="#f4b9a0"/>
  </g>
  <text x="520" y="338" font-family="'Noto Serif KR', AppleMyungjo, 'Nanum Myeongjo', serif" font-size="64" font-weight="700" fill="#1c1a17">오늘은 뭐 먹지?</text>
</svg>
